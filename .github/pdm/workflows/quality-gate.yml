name: PDM Quality Gate (Status Check)

# Docs: architecture map, ADRs, and runbook live on the wiki (see the Architecture page).
# This is the required status check on main; it posts a gate summary comment or uploads a gate-report artifact on non-PR runs.

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.12

      - name: Lint all workflows
        shell: bash
        run: ./actionlint -color -pyflakes=0

      - name: Validate examples and templates (Issue #184)
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE:$PATH"
          node scripts/examples-test.mjs

      - name: Run delivery-engine script unit tests
        shell: bash
        run: |
          node --test scripts/test/*.test.mjs

  code-quality:
    name: Code Quality (lint/typecheck/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect frontend toolchain
        id: detect
        uses: ./.github/actions/setup-pdm-toolchain

      - name: Note when no frontend
        if: steps.detect.outputs.found != 'true'
        run: echo "No frontend toolchain detected; code-quality gate passes by default."

      - name: Run code quality (lint/typecheck/test/build)
        uses: ./.github/actions/pdm-code-quality
        with:
          has_lint_script: ${{ steps.detect.outputs.has_lint_script }}
          has_typecheck_script: ${{ steps.detect.outputs.has_typecheck_script }}
          has_test_script: ${{ steps.detect.outputs.has_test_script }}
          has_build_script: ${{ steps.detect.outputs.has_build_script }}

  gate:
    name: PDM Quality Gate (Status Check)
    needs: [ workflow-lint, code-quality ]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.conclusion.outputs.result }}
    steps:
      - name: Print gate matrix
        shell: bash
        run: |
          echo "::notice::workflow-lint=${{ needs.workflow-lint.result }}"
          echo "::notice::code-quality=${{ needs.code-quality.result }}"

      - name: Compute gate conclusion
        id: conclusion
        shell: bash
        run: |
          if [[ "${{ needs.workflow-lint.result }}" == "failure" || "${{ needs.workflow-lint.result }}" == "cancelled" || "${{ needs.code-quality.result }}" == "failure" || "${{ needs.code-quality.result }}" == "cancelled" ]]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail gate on any upstream failure
        if: steps.conclusion.outputs.result == 'failure'
        shell: bash
        run: exit 1

      - name: Report gate result
        id: report
        shell: bash
        run: |
          {
            echo "## PDM Quality Gate"
            echo ""
            echo "- **Workflow lint (actionlint)**: ${{ needs.workflow-lint.result }}"
            echo "- **Code quality (lint/typecheck/test/build)**: ${{ needs.code-quality.result }}"
            echo "- **Gate conclusion**: ${{ steps.conclusion.outputs.result }}"
            echo ""
            echo "_The code-quality job runs the frontend suite (lint/typecheck/test/build) when a frontend toolchain is detected; otherwise it passes by default._"
          } > /tmp/gate-report.md

      - name: Post gate summary comment
        if: github.event.pull_request.number != null
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/gate-report.md', 'utf8');
            const resp = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
            console.log(`Posted comment ${resp.data.id}`);

      - name: Persist gate report for non-PR runs
        if: github.event.pull_request.number == null
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/pdm/reports"
          cp /tmp/gate-report.md "$GITHUB_WORKSPACE/.github/pdm/reports/gate-report.md"

      - name: Upload gate report
        if: always() && github.event.pull_request.number == null
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: .github/pdm/reports/gate-report.md
          retention-days: 7