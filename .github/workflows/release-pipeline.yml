name: PDM Release Deployment Pipeline

# Docs: architecture map, ADRs, and runbook live on the wiki (see the Architecture page).
# Dry-run (default) writes deployment records; dry_run:false or push-to-main calls the Deployment API.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target environment (promotes through later stages)
        type: choice
        options:
          - all
          - development
          - staging
          - production
        default: all
      dry_run:
        description: Dry-run only — skip GitHub Deployment API calls and write local summaries
        type: boolean
        default: true
      rollback_to:
        description: Optional commit SHA to roll back to (records a rollback event, no API call)
        type: string
        default: ''
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build (assemble deployable)
    runs-on: ubuntu-latest
    outputs:
      environment_chain: ${{ steps.chain.outputs.chain }}
      real_deploy: ${{ steps.mode.outputs.real }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect application stack
        id: stack
        shell: bash
        run: |
          if [[ -f frontend/package.json || -f Dockerfile || -f pyproject.toml ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.stack.outputs.found == 'true' && hashFiles('frontend/pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Build real deployable
        if: steps.stack.outputs.found == 'true' && hashFiles('frontend/pnpm-lock.yaml') != ''
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assemble build info
        shell: bash
        run: |
          mkdir -p dist
          cat <<EOF > dist/build-info.json
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stack_found": "${{ steps.stack.outputs.found }}"
          }
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-info
          path: dist/build-info.json
          retention-days: 1

      - name: Compute promotion chain
        id: chain
        shell: bash
        run: |
          case "${{ inputs.environment || 'all' }}" in
            development) chain="development" ;;
            staging)     chain="staging,production" ;;
            production)  chain="production" ;;
            *)           chain="development,staging,production" ;;
          esac
          echo "chain=${chain}" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.dry_run }}" == "false" ]]; then
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No stack note
        if: steps.stack.outputs.found == 'false'
        run: echo "No application stack detected; deployment steps are reference placeholders."

  deploy-development:
    name: Deploy to Development
    needs: build
    if: contains(needs.build.outputs.environment_chain, 'development')
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-info
          path: dist

      - name: Deploy to development
        shell: bash
        run: |
          echo "::notice::Deploying ${GITHUB_SHA} to development (placeholder — no deployment target configured)."
          cat dist/build-info.json

      - name: Verify development deployment
        shell: bash
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL || '' }}
        run: |
          if [[ -n "${DEPLOY_VERIFY_URL:-}" ]]; then
            echo "::notice::Verifying development at ${DEPLOY_VERIFY_URL}"
            curl -fsS --max-time 30 "${DEPLOY_VERIFY_URL}" || { echo "::error::Verification failed for development"; exit 1; }
          else
            echo "::notice::No DEPLOY_VERIFY_URL set — skipping live verification for development."
          fi

      - name: Record development deployment
        env:
          ENV_NAME: development
        uses: actions/github-script@v9
        with:
          script: |
            const envName = process.env.ENV_NAME;
            if ('${{ needs.build.outputs.real_deploy }}' === 'true') {
              const resp = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: envName,
                auto_merge: false,
                required_contexts: [],
              });
              console.log(`Created deployment ${resp.data.id} for ${envName}.`);
            } else {
              console.log(`Dry-run: skipping GitHub Deployment API for ${envName}.`);
              const fs = require('fs');
              const outDir = `${process.env.GITHUB_WORKSPACE}/.github/pdm/deployments`;
              fs.mkdirSync(outDir, { recursive: true });
              fs.writeFileSync(
                `${outDir}/deploy-${envName}.md`,
                `# Deployment: ${envName}\n\n- sha: ${context.sha}\n- ref: ${context.ref}\n- mode: dry-run\n`
              );
            }

      - name: Upload development deployment record
        if: needs.build.outputs.real_deploy == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-record-development
          path: .github/pdm/deployments/deploy-development.md
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    needs:
      - build
      - deploy-development
    if: always() && needs.build.result == 'success' && (needs.deploy-development.result == 'success' || needs.deploy-development.result == 'skipped') && contains(needs.build.outputs.environment_chain, 'staging')
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-info
          path: dist

      - name: Deploy to staging
        shell: bash
        run: |
          echo "::notice::Deploying ${GITHUB_SHA} to staging (placeholder — approval via GitHub environment protection rules)."
          cat dist/build-info.json

      - name: Verify staging deployment
        shell: bash
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL || '' }}
        run: |
          if [[ -n "${DEPLOY_VERIFY_URL:-}" ]]; then
            echo "::notice::Verifying staging at ${DEPLOY_VERIFY_URL}"
            curl -fsS --max-time 30 "${DEPLOY_VERIFY_URL}" || { echo "::error::Verification failed for staging"; exit 1; }
          else
            echo "::notice::No DEPLOY_VERIFY_URL set — skipping live verification for staging."
          fi

      - name: Record staging deployment
        env:
          ENV_NAME: staging
        uses: actions/github-script@v9
        with:
          script: |
            const envName = process.env.ENV_NAME;
            if ('${{ needs.build.outputs.real_deploy }}' === 'true') {
              const resp = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: envName,
                auto_merge: false,
                required_contexts: [],
              });
              console.log(`Created deployment ${resp.data.id} for ${envName}.`);
            } else {
              console.log(`Dry-run: skipping GitHub Deployment API for ${envName}.`);
              const fs = require('fs');
              const outDir = `${process.env.GITHUB_WORKSPACE}/.github/pdm/deployments`;
              fs.mkdirSync(outDir, { recursive: true });
              fs.writeFileSync(
                `${outDir}/deploy-${envName}.md`,
                `# Deployment: ${envName}\n\n- sha: ${context.sha}\n- ref: ${context.ref}\n- mode: dry-run\n`
              );
            }

      - name: Upload staging deployment record
        if: needs.build.outputs.real_deploy == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-record-staging
          path: .github/pdm/deployments/deploy-staging.md
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    needs:
      - build
      - deploy-staging
    if: always() && needs.build.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && contains(needs.build.outputs.environment_chain, 'production')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-info
          path: dist

      - name: Deploy to production
        shell: bash
        run: |
          echo "::notice::Deploying ${GITHUB_SHA} to production (placeholder — approval via GitHub environment protection rules)."
          cat dist/build-info.json

      - name: Verify production deployment
        shell: bash
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL || '' }}
        run: |
          if [[ -n "${DEPLOY_VERIFY_URL:-}" ]]; then
            echo "::notice::Verifying production at ${DEPLOY_VERIFY_URL}"
            curl -fsS --max-time 30 "${DEPLOY_VERIFY_URL}" || { echo "::error::Verification failed for production"; exit 1; }
          else
            echo "::notice::No DEPLOY_VERIFY_URL set — skipping live verification for production."
          fi

      - name: Record production deployment
        env:
          ENV_NAME: production
        uses: actions/github-script@v9
        with:
          script: |
            const envName = process.env.ENV_NAME;
            if ('${{ needs.build.outputs.real_deploy }}' === 'true') {
              const resp = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: envName,
                auto_merge: false,
                required_contexts: [],
              });
              console.log(`Created deployment ${resp.data.id} for ${envName}.`);
            } else {
              console.log(`Dry-run: skipping GitHub Deployment API for ${envName}.`);
              const fs = require('fs');
              const outDir = `${process.env.GITHUB_WORKSPACE}/.github/pdm/deployments`;
              fs.mkdirSync(outDir, { recursive: true });
              fs.writeFileSync(
                `${outDir}/deploy-${envName}.md`,
                `# Deployment: ${envName}\n\n- sha: ${context.sha}\n- ref: ${context.ref}\n- mode: dry-run\n`
              );
            }

      - name: Upload production deployment record
        if: needs.build.outputs.real_deploy == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-record-production
          path: .github/pdm/deployments/deploy-production.md
          retention-days: 7

  rollback:
    name: Rollback (dry-run record)
    needs: build
    if: inputs.rollback_to != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record rollback event
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment || 'all' }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          mkdir -p .github/pdm/deployments
          cat <<EOF > .github/pdm/deployments/rollback.md
          # Rollback

          - from: ${GITHUB_SHA}
          - to: ${ROLLBACK_TO}
          - environment chain: ${TARGET_ENV}
          - recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - mode: dry-run (artifact record — no GitHub Deployment API call)
          EOF
          echo "Recorded rollback to ${ROLLBACK_TO}"

      - name: Record real rollback deployment
        if: needs.build.outputs.real_deploy == 'true'
        env:
          TARGET_ENV: ${{ inputs.environment || 'all' }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        uses: actions/github-script@v9
        with:
          # A real-mode rollback is a first-class delivery event: it creates a
          # Deployment API record for the rollback target so the recovery shows
          # up in the native audit trail (delivery telemetry's MTTR proxy reads
          # "failure event -> next deployment"). The controlled T10.2 drill
          # files its one labeled incident between the broken deploy and this
          # recovery record.
          script: |
            const envName = process.env.TARGET_ENV;
            const resp = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.ROLLBACK_TO,
              environment: envName,
              auto_merge: false,
              required_contexts: [],
              description: 'rollback recovery deployment',
            });
            console.log(`Created rollback deployment ${resp.data.id} for ${envName} at ${process.env.ROLLBACK_TO}.`);

      - name: Upload rollback record
        uses: actions/upload-artifact@v7
        with:
          name: rollback-record
          path: .github/pdm/deployments/rollback.md
          retention-days: 7
