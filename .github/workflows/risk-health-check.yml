name: PDM Risk & Code Health Check

# Docs: architecture map, ADRs, and runbook live on the wiki (see the Architecture page).
# This workflow posts a PR comment or uploads a report artifact on non-PR runs.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: risk-health-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    name: Security (Secrets & Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Vulnerability scan (OSV)
        if: hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/requirements*.txt', '**/poetry.lock', '**/Pipfile.lock', '**/Cargo.lock', '**/go.sum', '**/Gemfile.lock', '**/composer.lock', '**/pom.xml', '**/build.gradle*') != ''
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive .

      - name: Note skipped vulnerability scan
        if: hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/requirements*.txt', '**/poetry.lock', '**/Pipfile.lock', '**/Cargo.lock', '**/go.sum', '**/Gemfile.lock', '**/composer.lock', '**/pom.xml', '**/build.gradle*') == ''
        run: echo "No dependency manifests found; vulnerability scan skipped."

  code-health:
    name: Code Health (Shift-left quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect frontend toolchain
        id: detect
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f pnpm-lock.yaml ]]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f package.json ]] && grep -q '"lint":' package.json; then
            echo "has_lint_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lint_script=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f package.json ]] && grep -q '"typecheck":' package.json; then
            echo "has_typecheck_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_typecheck_script=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f package.json ]] && grep -q '"test":' package.json; then
            echo "has_test_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test_script=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show health summary
        if: steps.detect.outputs.found != 'true'
        run: echo "No frontend toolchain detected; code-health check passes by default."

      - name: Set up pnpm
        if: steps.detect.outputs.has_lockfile == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        if: steps.detect.outputs.has_lockfile == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.has_lockfile == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.has_lint_script == 'true'
        run: pnpm run lint

      - name: Typecheck
        if: steps.detect.outputs.has_typecheck_script == 'true'
        run: pnpm run typecheck

      - name: Test
        if: steps.detect.outputs.has_test_script == 'true'
        run: pnpm test

  risk-review:
    name: Diff Risk Review (AI-assisted)
    if: always()
    needs:
      - security
      - code-health
    runs-on: ubuntu-latest
    outputs:
      risk_score: ${{ steps.review.outputs.risk_score }}
      risk_summary: ${{ steps.review.outputs.risk_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build risk-review payload
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || '4b825dc642cb6eb9a060e54bf8d69288fbee4904' }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p .github/pdm/reports
          git diff --numstat "${base}..${head}" > /tmp/risk-review.numstat 2>/dev/null || true
          {
            echo "{"
            echo "  \"base\": \"${base}\","
            echo "  \"head\": \"${head}\","
            echo "  \"numstat\": \"$(base64 < /tmp/risk-review.numstat | tr -d '\n')\""
            echo "}"
          } > .github/pdm/reports/risk-review-input.json
          echo "Risk payload written for ${base}..${head}"

      - name: Run AI-assisted diff risk review
        id: review
        shell: bash
        env:
          AI_REVIEW_CMD: ${{ vars.AI_REVIEW_CMD }}
        run: |
          if [[ -f scripts/risk-review.mjs ]]; then
            node scripts/risk-review.mjs .github/pdm/reports/risk-review-input.json .github/pdm/reports/risk-review.md \
              > .github/pdm/reports/risk-review.out 2>&1 || true
            if grep -qE '^risk_score=' .github/pdm/reports/risk-review.out; then
              grep -E '^risk_(score|summary)=' .github/pdm/reports/risk-review.out >> "$GITHUB_OUTPUT"
            else
              echo "risk_score=error" >> "$GITHUB_OUTPUT"
              echo "risk_summary=risk-review step did not produce a score" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "risk_score=skipped" >> "$GITHUB_OUTPUT"
            echo "risk_summary=No scripts/risk-review.mjs checked in" >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Diff risk review' '' 'Skipped: no scripts/risk-review.mjs checked in.' > .github/pdm/reports/risk-review.md
          fi

      - name: Show review output on failure
        if: failure()
        run: cat .github/pdm/reports/risk-review.out 2>/dev/null || true

  risk-report:
    name: Risk Report
    if: always()
    needs:
      - security
      - code-health
      - risk-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build health summary
        id: summary
        shell: bash
        run: |
          {
            echo "## PDM Risk & Code Health Check"
            echo ""
            echo "- **Secrets scan (gitleaks)**: ${{ needs.security.result }}"
            echo "- **Dependency vulnerabilities (OSV)**: scan runs when manifests exist; otherwise skipped."
            echo "- **Code health**: ${{ needs.code-health.result }} (frontend lint/typecheck/tests run when a toolchain is detected; otherwise no-op)."
            echo "- **Diff risk review**: ${{ needs.risk-review.outputs.risk_score }}/10 — ${{ needs.risk-review.outputs.risk_summary }} (AI-hook)."
            echo ""
            echo "_Diff risk review runs scripts/risk-review.mjs offline; set the AI_REVIEW_CMD repo variable to invoke an AI agent runner instead._"
          } >> /tmp/risk-report.md

      - name: Post risk report comment
        if: github.event.pull_request.number != null
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/risk-report.md', 'utf8');
            const resp = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
            console.log(`Posted comment ${resp.data.id}`);

      - name: Persist risk report for non-PR runs
        if: github.event.pull_request.number == null
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/pdm/reports"
          cp /tmp/risk-report.md "$GITHUB_WORKSPACE/.github/pdm/reports/risk-report.md"

      - name: Upload risk report
        if: always() && github.event.pull_request.number == null
        uses: actions/upload-artifact@v7
        with:
          name: risk-report
          path: .github/pdm/reports/risk-report.md
          retention-days: 7